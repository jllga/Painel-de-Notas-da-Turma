<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Notas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<h1>Painel de Notas da Turma</h1>
<p class="subtitulo">Digite o nome e a nota do aluno. Média para aprovação: 6,0.</p>
<section class="formulario">
<label for="campoNome">Nome do aluno</label>
<input type="text" id="campoNome" placeholder="Ex.: Maria">
<label for="campoNota">Nota (0 a 10)</label>
<input type="number" id="campoNota" min="0" max="10" step="0.1" placeholder="Ex.: 7.5">
<button id="botaoAdicionar">Adicionar aluno</button>
<p id="mensagem"></p>
</section>
<h2>Alunos</h2>
<ul id="listaAlunos"></ul>
<p id="resumo">Aprovados: 0 de 0</p>
</main>
<script src="script.js"></script>
</body>
</html>
